openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Research Model Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Research session management
  - name: papers
    description: Paper search and management
  - name: variables
    description: Variable extraction
  - name: models
    description: Research model generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all research sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new research session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session name or topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get session statistics summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /papers/search:
    post:
      operationId: searchPapers
      tags: [papers]
      summary: Search papers by topic from OpenAlex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPapersBody"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSearchResult"

  /papers/lookup:
    post:
      operationId: lookupPaper
      tags: [papers]
      summary: Look up a paper by DOI, URL, or OpenAlex ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupPaperBody"
      responses:
        "200":
          description: Paper found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperSearchResult"
        "404":
          description: Paper not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error

  /sessions/{id}/papers/bulk-import:
    post:
      operationId: bulkImportPapers
      tags: [papers]
      summary: Bulk-import papers from a BibTeX or RIS export
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportPapersBody"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportPapersResponse"

  /sessions/{id}/papers:
    get:
      operationId: listSessionPapers
      tags: [papers]
      summary: List papers added to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Papers in session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paper"
    post:
      operationId: addPaperToSession
      tags: [papers]
      summary: Add a paper to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPaperBody"
      responses:
        "201":
          description: Added paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"

  /sessions/{sessionId}/papers/{paperId}:
    delete:
      operationId: removePaperFromSession
      tags: [papers]
      summary: Remove a paper from a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/{paperId}/extract:
    post:
      operationId: extractVariables
      tags: [variables]
      summary: Extract research variables from a paper using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extracted variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"

  /sessions/{id}/variables:
    get:
      operationId: listSessionVariables
      tags: [variables]
      summary: List all extracted variables for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variables list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"

  /sessions/{id}/image-blocklist:
    post:
      operationId: addImageBlocklistEntry
      tags: [models]
      summary: Block an image (by sourceUrl) from future searches in this session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUrl, sourceDomain]
              properties:
                sourceUrl:
                  type: string
                sourceDomain:
                  type: string
                title:
                  type: ["string", "null"]
                reason:
                  type: ["string", "null"]
      responses:
        "200":
          description: Already blocked (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBlocklistEntry"
        "201":
          description: Newly blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBlocklistEntry"

  /sessions/{id}/variable-graph:
    get:
      operationId: getVariableGraph
      tags: [variables]
      summary: Get variable relationship graph data for visualization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableGraph"

  /sessions/{id}/model-assistant:
    post:
      operationId: chatModelAssistant
      tags: [models]
      summary: Conversational assistant that helps the user shape model-generation directives based on their notes, files, and the session's papers/variables.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                      attachments:
                        type: array
                        items:
                          type: object
                          required: [name, kind, data]
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                              enum: [image, text]
                              description: image = base64 data URL; text = plain text (e.g. extracted from a PDF client-side)
                            data:
                              type: string
      responses:
        "200":
          description: Assistant reply, with optional one-click generation directive
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply:
                    type: string
                  suggestion:
                    type: object
                    properties:
                      userPrompt:
                        type: string
                      focusVariableIds:
                        type: array
                        items:
                          type: integer
                      requiredOperators:
                        type: array
                        items:
                          type: string
                  needsMorePapers:
                    type: object
                    description: Set when the AI judges the existing session materials are insufficient to answer the user's research question.
                    required: [reason]
                    properties:
                      reason:
                        type: string
                      searchQuery:
                        type: string
                      missingConstructs:
                        type: array
                        items:
                          type: string

  /sessions/{id}/model-assistant/search-model-images:
    post:
      operationId: searchModelImages
      tags: [models]
      summary: Search the web for research model / conceptual framework figures matching a topic. Returns thumbnails plus original page URLs so the user can quickly find the source paper.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Topic / construct to search for. The server will augment it with academic phrasing unless `raw` is true.
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                page:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1-indexed page number for "换一批 / load more". Defaults to 1.
                raw:
                  type: boolean
                  description: When true, skip server-side query augmentation and use the user's text exactly.
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                type: object
                required: [results, query]
                properties:
                  query:
                    type: string
                    description: All expanded queries joined with " | " for display purposes.
                  rawQuery:
                    type: string
                    description: The original query the user typed, before AI expansion.
                  expandedQueries:
                    type: array
                    items:
                      type: string
                    description: AI-expanded English academic queries that were actually searched.
                  provider:
                    type: string
                    enum: [serpapi, brave]
                    description: Which upstream image search provider was actually used.
                  page:
                    type: integer
                    description: Echoes the page number that was actually served.
                  hasMore:
                    type: boolean
                    description: True if the upstream returned a full result set, suggesting more pages may exist.
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, thumbnailUrl, sourceUrl, sourceDomain]
                      properties:
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                        imageUrl:
                          type: string
                        sourceUrl:
                          type: string
                        sourceDomain:
                          type: string
                        width:
                          type: integer
                        height:
                          type: integer
                        category:
                          type: string
                          enum: [conceptual_model, sem_path, framework]
                          description: AI-assigned category — what KIND of model figure this is. Absent only when the AI gate was skipped (raw mode) or fell back.
                        why:
                          type: string
                          description: Short AI-written reason (≤120 chars) explaining why this figure matches the user's session. Absent for fallbacks.
        "503":
          description: Search provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/papers/{paperId}/model-figures:
    get:
      operationId: getPaperModelFigures
      tags: [papers]
      summary: Find model / framework figures for a single paper. Cached on the paper row after the first call.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: When true, ignores cache and re-runs the upstream search.
      responses:
        "200":
          description: Up to 3 figure thumbnails for this paper (may be empty).
          content:
            application/json:
              schema:
                type: object
                required: [paperId, results, cached]
                properties:
                  paperId:
                    type: integer
                  cached:
                    type: boolean
                  fetchedAt:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, thumbnailUrl, sourceUrl, sourceDomain]
                      properties:
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                        imageUrl:
                          type: string
                        sourceUrl:
                          type: string
                        sourceDomain:
                          type: string
        "404":
          description: Paper not found in the specified session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Image search provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/model-assistant/search-model-papers:
    post:
      operationId: searchModelPapers
      tags: [models]
      summary: Search OpenAlex for papers likely to contain a conceptual model figure on the topic. Returns paper cards plus an AI-judged "model figure likelihood" so the user can quickly find papers worth opening to look at the model diagram inside.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Topic / construct to search for. The server will translate Chinese / rough English into precise academic queries unless `raw` is true.
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                page:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1-indexed page number for "换一批 / load more". Defaults to 1.
                raw:
                  type: boolean
                  description: When true, skip AI query expansion.
      responses:
        "200":
          description: Paper search results with model-figure likelihood
          content:
            application/json:
              schema:
                type: object
                required: [papers, query]
                properties:
                  query:
                    type: string
                  rawQuery:
                    type: string
                  expandedQueries:
                    type: array
                    items:
                      type: string
                  page:
                    type: integer
                  hasMore:
                    type: boolean
                  papers:
                    type: array
                    items:
                      type: object
                      required: [externalId, title, authors, url, modelFigureLikelihood]
                      properties:
                        externalId:
                          type: string
                        title:
                          type: string
                        abstract:
                          type: ["string", "null"]
                        authors:
                          type: array
                          items:
                            type: string
                        year:
                          type: ["integer", "null"]
                        venue:
                          type: ["string", "null"]
                        citationCount:
                          type: ["integer", "null"]
                        openAccessUrl:
                          type: ["string", "null"]
                        url:
                          type: string
                        modelFigureLikelihood:
                          type: string
                          enum: [high, medium, low]
                          description: AI-judged likelihood that the paper contains a conceptual / SEM model figure.
                        modelFigureReason:
                          type: string
                          description: Short justification for the likelihood rating.
        "502":
          description: Upstream search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/generate:
    post:
      operationId: generateModels
      tags: [models]
      summary: Generate new research model combinations using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userPrompt:
                  type: string
                  description: Optional user-supplied direction/constraints/research focus to steer the AI
                numModels:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Number of model proposals to generate (default 3)
                focusVariableIds:
                  type: array
                  items:
                    type: integer
                  description: Variable IDs the user wants the AI to prioritize including
      responses:
        "200":
          description: Generated model combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/models:
    get:
      operationId: listSessionModels
      tags: [models]
      summary: List generated models for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/learning-stats:
    get:
      operationId: getSessionLearningStats
      tags: [models]
      summary: How many feedback rounds the AI has learned from for this session/global
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalFeedback:
                    type: integer
                  withSelections:
                    type: integer
                  withEdits:
                    type: integer
                required: [totalFeedback, withSelections, withEdits]

  /models/{id}:
    patch:
      operationId: updateModel
      tags: [models]
      summary: Update a model (user edits to name/description/rationale/nodes/edges)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rationale:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
    get:
      operationId: getModel
      tags: [models]
      summary: Get a specific research model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research model detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/quality-report:
    get:
      operationId: getModelQualityReport
      tags: [models]
      summary: Compute a structural / evidence / layer / role-duplication / moderator-justified quality report for a model. Pure compute — no AI call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quality report
          content:
            application/json:
              schema:
                type: object
                required: [structuralScore, evidenceScore, layerCompliance, duplicateRoleCheck, moderatorJustified, weakEdges, totals]
                properties:
                  structuralScore:
                    type: integer
                    description: 0-100. Heuristic match against any of the 17 theory backbones.
                  evidenceScore:
                    type: integer
                    description: 0-100. Percentage of edges with evidenceHypothesisId or effectSize or evidenceLocation.
                  layerCompliance:
                    type: boolean
                    description: True when no edge crosses construct layers in the wrong direction (cognitive→stimulus is wrong).
                  duplicateRoleCheck:
                    type: boolean
                    description: True when no canonical construct appears in two conflicting roles (mediator AND moderator).
                  moderatorJustified:
                    type: boolean
                    description: True when EVERY moderates-edge has a non-empty moderatorJustification.
                  weakEdges:
                    type: array
                    items:
                      type: object
                      required: [fromVariableName, toVariableName, reason]
                      properties:
                        fromVariableName:
                          type: string
                        toVariableName:
                          type: string
                        reason:
                          type: string
                          description: Short i18n-ready code-style reason, e.g. "no_evidence", "layer_jump", "duplicate_role", "missing_moderator_justification".
                  totals:
                    type: object
                    required: [edges, edgesWithEvidence, moderatesEdges, moderatesJustified]
                    properties:
                      edges:
                        type: integer
                      edgesWithEvidence:
                        type: integer
                      moderatesEdges:
                        type: integer
                      moderatesJustified:
                        type: integer
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/literature-review:
    post:
      operationId: generateModelLiteratureReview
      tags: [models]
      summary: AI-generate a publication-ready literature review paragraph (with APA-7 in-text citations) summarizing the model and its evidence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lang:
                  type: string
                  enum: [zh, en]
                  description: Language for the generated paragraph. Defaults to "zh".
      responses:
        "200":
          description: Generated paragraph
          content:
            application/json:
              schema:
                type: object
                required: [markdown, lang]
                properties:
                  markdown:
                    type: string
                    description: Markdown paragraph with APA-7 in-text citations like (Wang & Liu, 2023).
                  lang:
                    type: string
                    enum: [zh, en]
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/select:
    post:
      operationId: selectModel
      tags: [models]
      summary: Mark a model as selected by the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/live-model:
    get:
      operationId: getLiveModel
      tags: [live-model]
      summary: Get the user's evolving research model for this session (lazy-creates on first access)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live model with nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/nodes:
    post:
      operationId: addLiveModelNode
      tags: [live-model]
      summary: Add a variable to the live model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variableId]
              properties:
                variableId:
                  type: integer
                sourceModelId:
                  type: integer
                  nullable: true
                  description: AI candidate model this variable was picked from (for provenance)
                userAdded:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/nodes/{nodeId}:
    delete:
      operationId: removeLiveModelNode
      tags: [live-model]
      summary: Remove a variable (and any edges touching it) from the live model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"
    patch:
      operationId: updateLiveModelNodePosition
      tags: [live-model]
      summary: Update the canvas position of a live-model node (drag-to-reposition).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionX, positionY]
              properties:
                positionX:
                  type: number
                positionY:
                  type: number
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/edges:
    post:
      operationId: addLiveModelEdge
      tags: [live-model]
      summary: Add an edge to the live model. Must have provenance (paperId+citationText) OR be userAdded=true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromVariableId, toVariableId, relationship]
              properties:
                fromVariableId:
                  type: integer
                toVariableId:
                  type: integer
                relationship:
                  type: string
                  enum: [positive, negative, mediates, moderates]
                provenancePaperId:
                  type: integer
                  nullable: true
                provenanceCitationText:
                  type: string
                  nullable: true
                provenanceFigureThumbnailUrl:
                  type: string
                  nullable: true
                provenanceFigureSourceUrl:
                  type: string
                  nullable: true
                provenanceFigureSourceDomain:
                  type: string
                  nullable: true
                confidence:
                  type: string
                  enum: [high, medium, low]
                  default: medium
                sourceModelId:
                  type: integer
                  nullable: true
                userAdded:
                  type: boolean
                  default: false
                moderatesEdgeId:
                  type: integer
                  nullable: true
                  description: Required only when relationship="moderates" AND the user dropped the connection on an existing edge. Points to the edge being moderated; the canvas uses it to route the arrow to that edge's midpoint.
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/edges/{edgeId}:
    delete:
      operationId: removeLiveModelEdge
      tags: [live-model]
      summary: Remove an edge from the live model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: edgeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/models/{modelId}/evidence-search:
    post:
      operationId: searchModelEvidence
      tags: [evidence]
      summary: Find papers (in session library and/or via web search) that support each edge of an AI candidate model. Read-only — no DB writes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSearchRequest"
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSearchResult"

  /sessions/{id}/models/{modelId}/evidence-apply:
    post:
      operationId: applyModelEvidence
      tags: [evidence]
      summary: Snapshot the current model, add chosen web papers to the session library, and attach evidence to candidate-model edges. Returns the updated model.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceApplyRequest"
      responses:
        "200":
          description: Updated candidate model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/models/{modelId}/versions:
    get:
      operationId: listModelVersions
      tags: [evidence]
      summary: List recent saved snapshots of this candidate model (most recent first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersionSummary"

  /sessions/{id}/models/{modelId}/revert/{versionId}:
    post:
      operationId: revertModelToVersion
      tags: [evidence]
      summary: Restore the candidate model from a saved snapshot (also snapshots the current state first so the revert itself is undoable).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reverted candidate model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/live-model/evidence-search:
    post:
      operationId: searchLiveModelEvidence
      tags: [evidence]
      summary: Find papers (library and/or web) that support each edge of the user's live model. Read-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSearchRequest"
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSearchResult"

  /sessions/{id}/live-model/evidence-apply:
    post:
      operationId: applyLiveModelEvidence
      tags: [evidence]
      summary: Snapshot the current live model, import chosen web papers into the session library, and attach evidence to live-model edges.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceApplyRequest"
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/versions:
    get:
      operationId: listLiveModelVersions
      tags: [evidence]
      summary: List recent saved snapshots of the live model.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersionSummary"

  /sessions/{id}/live-model/revert/{versionId}:
    post:
      operationId: revertLiveModelToVersion
      tags: [evidence]
      summary: Restore the live model from a saved snapshot.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reverted live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/import-from-model:
    post:
      operationId: importLiveModelFromModel
      tags: [live-model]
      summary: One-click import all nodes+edges from an AI candidate model into the live model (preserves provenance)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: integer
                replace:
                  type: boolean
                  default: false
                  description: If true, clears existing nodes/edges before importing.
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Session:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [searching, extracting, generating, complete]
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - topic
        - status
        - paperCount
        - variableCount
        - modelCount
        - createdAt
        - updatedAt

    CreateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string
      required:
        - name
        - topic

    UpdateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string

    SessionSummary:
      type: object
      properties:
        sessionId:
          type: integer
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        independentVarCount:
          type: integer
        mediatorVarCount:
          type: integer
        moderatorVarCount:
          type: integer
        dependentVarCount:
          type: integer
        selectedModelId:
          type: ["integer", "null"]
      required:
        - sessionId
        - paperCount
        - variableCount
        - modelCount
        - independentVarCount
        - mediatorVarCount
        - moderatorVarCount
        - dependentVarCount
        - selectedModelId

    SearchPapersBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
      required:
        - query

    LookupPaperBody:
      type: object
      properties:
        identifier:
          type: string
          description: A DOI, OpenAlex ID, arXiv ID, or paper URL
      required:
        - identifier

    BulkImportPapersBody:
      type: object
      properties:
        content:
          type: string
          description: Raw BibTeX or RIS file content (as exported from CNKI / WoS / Scopus / Zotero / EndNote)
      required:
        - content

    BulkImportPapersResponse:
      type: object
      properties:
        importedCount:
          type: integer
        skippedCount:
          type: integer
          description: Already existed in the session
        failedCount:
          type: integer
        totalDois:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: string
              reason:
                type: string
            required: [identifier, reason]
      required:
        - importedCount
        - skippedCount
        - failedCount
        - totalDois
        - failures

    PaperSearchResult:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    Paper:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
        extracted:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - externalId
        - title
        - authors
        - url
        - extracted
        - createdAt

    AddPaperBody:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    Variable:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        name:
          type: string
        type:
          type: string
          enum: [independent, mediator, moderator, dependent]
        definition:
          type: string
        citationText:
          type: string
        canonicalConstructId:
          type: ["string", "null"]
          description: Lower-case canonical construct id (e.g. "trust", "purchase intention"). Variables across papers that map to the same construct share this id.
        constructLayer:
          type: ["string", "null"]
          enum: [stimulus, cognitive, affective, intention, behavior, null]
          description: Standard psychology pipeline layer for the variable.
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - paperId
        - paperTitle
        - paperAuthors
        - name
        - type
        - definition
        - citationText
        - createdAt

    ImageBlocklistEntry:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        sourceUrl:
          type: string
        sourceDomain:
          type: string
        title:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - sourceUrl
        - sourceDomain
        - createdAt

    VariableGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
      required:
        - nodes
        - edges

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        paperCount:
          type: integer
      required:
        - id
        - label
        - type
        - paperCount

    GraphEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
        relationship:
          type: string
          enum: [positive, negative, moderates, mediates]
          description: Kind of directional relationship the paper states between source and target.
        statement:
          type: string
          description: Verbatim sentence from the paper supporting this edge.
      required:
        - source
        - target
        - paperId
        - paperTitle
        - relationship
        - statement

    ResearchModel:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        name:
          type: string
        description:
          type: string
        rationale:
          type: string
        selected:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ModelNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ModelEdge"
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - name
        - description
        - rationale
        - selected
        - nodes
        - edges
        - createdAt

    ModelNode:
      type: object
      properties:
        variableId:
          type: integer
        variableName:
          type: string
        type:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        positionX:
          type: ["number", "null"]
          description: User-arranged X position on the editable canvas (null = use auto layout).
        positionY:
          type: ["number", "null"]
          description: User-arranged Y position on the editable canvas (null = use auto layout).
      required:
        - variableId
        - variableName
        - type
        - paperId
        - paperTitle
        - paperAuthors

    ModelEdge:
      type: object
      properties:
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        evidencePaperId:
          type: integer
        evidencePaperTitle:
          type: string
        evidencePaperAuthors:
          type: array
          items:
            type: string
        evidencePaperYear:
          type: ["integer", "null"]
        evidenceCitationText:
          type: string
        evidenceHypothesisId:
          type: ["string", "null"]
          description: References paper_hypotheses.hypothesis_id (e.g. "H2a") when the edge is grounded in a formal hypothesis.
        effectSize:
          type: ["string", "null"]
          description: Reported effect size (e.g. "β=.34, p<.001") when extracted from the source paper.
        evidenceLocation:
          type: ["string", "null"]
          description: Where in the source paper the edge is supported (e.g. "p. 412", "Section 3.2").
        moderatorJustification:
          type: ["string", "null"]
          description: REQUIRED when relationship="moderates". Explains theoretically why the variable can condition the moderated path.
        additionalEvidence:
          type: array
          description: Extra supporting papers attached after-the-fact via the AI evidence-matching feature.
          items:
            $ref: "#/components/schemas/AdditionalEvidence"
      required:
        - fromVariableId
        - toVariableId
        - fromVariableName
        - toVariableName
        - relationship
        - evidencePaperId
        - evidencePaperTitle
        - evidencePaperAuthors
        - evidenceCitationText

    AdditionalEvidence:
      type: object
      required: [paperId, paperTitle, citationText, source]
      properties:
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        citationText:
          type: string
        source:
          type: string
          enum: [library, web]
        score:
          type: ["number", "null"]
        addedAt:
          type: string
          format: date-time

    LiveModelNodeOut:
      type: object
      properties:
        id:
          type: integer
        variableId:
          type: integer
        variableName:
          type: string
        variableType:
          type: string
        paperId:
          type: integer
        sourceModelId:
          type: ["integer", "null"]
        userAdded:
          type: boolean
        positionX:
          type: ["number", "null"]
          description: User-arranged X position on the editable canvas (null = use auto layout).
        positionY:
          type: ["number", "null"]
          description: User-arranged Y position on the editable canvas (null = use auto layout).
        createdAt:
          type: string
      required:
        - id
        - variableId
        - variableName
        - variableType
        - paperId
        - userAdded
        - createdAt

    LiveModelEdgeOut:
      type: object
      properties:
        id:
          type: integer
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        provenancePaperId:
          type: ["integer", "null"]
        provenancePaperTitle:
          type: ["string", "null"]
        provenanceCitationText:
          type: ["string", "null"]
        provenanceFigureThumbnailUrl:
          type: ["string", "null"]
        provenanceFigureSourceUrl:
          type: ["string", "null"]
        provenanceFigureSourceDomain:
          type: ["string", "null"]
        confidence:
          type: string
        sourceModelId:
          type: ["integer", "null"]
        userAdded:
          type: boolean
        moderatesEdgeId:
          type: ["integer", "null"]
          description: When relationship="moderates", optionally points to another edge that this edge moderates. The canvas reroutes the moderator's arrow tip to land on the midpoint of the referenced edge.
        hasProvenance:
          type: boolean
          description: True if a paperId+citationText backs this edge.
        additionalEvidence:
          type: array
          items:
            $ref: "#/components/schemas/AdditionalEvidence"
        createdAt:
          type: string
      required:
        - id
        - fromVariableId
        - toVariableId
        - fromVariableName
        - toVariableName
        - relationship
        - confidence
        - userAdded
        - hasProvenance
        - createdAt

    LiveModelDetail:
      type: object
      properties:
        liveModel:
          type: object
          properties:
            id:
              type: integer
            sessionId:
              type: integer
            notes:
              type: string
            version:
              type: integer
            createdAt:
              type: string
            updatedAt:
              type: string
          required: [id, sessionId, notes, version, createdAt, updatedAt]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LiveModelNodeOut"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LiveModelEdgeOut"
        unsupportedEdgeCount:
          type: integer
          description: Number of edges with no provenance (paper backing) — UI should warn.
      required:
        - liveModel
        - nodes
        - edges
        - unsupportedEdgeCount

    EvidenceSearchRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [library, web]
          default: [library, web]
        granularity:
          type: array
          items:
            type: string
            enum: [overall, per-edge]
          default: [overall, per-edge]
        instructions:
          type: string
          nullable: true
          description: Optional natural-language guidance from the user (e.g. "prefer recent meta-analyses").

    EvidencePaperHit:
      type: object
      required: [source, title, authors, score, rationale]
      properties:
        source:
          type: string
          enum: [library, web]
        paperId:
          type: integer
          nullable: true
          description: Present when source=library.
        externalId:
          type: string
          nullable: true
          description: OpenAlex W-id when source=web.
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
          nullable: true
        abstract:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        score:
          type: number
          description: AI-assessed relevance, 0..1.
        rationale:
          type: string
          description: Short why-this-matches.
        evidenceQuote:
          type: string
          nullable: true
          description: Verbatim sentence supporting the matched edge (per-edge hits only).

    EvidenceEdgeMatch:
      type: object
      required: [edgeKey, fromVariableName, toVariableName, relationship, hits]
      properties:
        edgeKey:
          type: string
          description: Stable identifier "fromVariableId-toVariableId-relationship".
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        hits:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePaperHit"

    EvidenceSearchResult:
      type: object
      required: [overallMatches, perEdgeMatches]
      properties:
        overallMatches:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePaperHit"
        perEdgeMatches:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEdgeMatch"
        durationMs:
          type: integer

    EvidenceApplyRequest:
      type: object
      properties:
        addPapers:
          type: array
          description: Web hits the user confirmed; will be imported into the session library if not already present.
          items:
            type: object
            required: [externalId, title]
            properties:
              externalId:
                type: string
              title:
                type: string
              authors:
                type: array
                items:
                  type: string
              year:
                type: integer
                nullable: true
              abstract:
                type: string
                nullable: true
              url:
                type: string
                nullable: true
        edgeAttachments:
          type: array
          items:
            type: object
            required: [edgeKey, evidenceQuote]
            properties:
              edgeKey:
                type: string
                description: "fromVariableId-toVariableId-relationship"
              paperId:
                type: integer
                nullable: true
                description: Library paper id; takes precedence over externalId.
              externalId:
                type: string
                nullable: true
                description: OpenAlex W-id for web hit; resolved against addPapers and the session library.
              evidenceQuote:
                type: string
        reason:
          type: string
          nullable: true
          description: Optional human-readable description of the change (shown in version history).

    ModelVersionSummary:
      type: object
      required: [id, kind, reason, nodeCount, edgeCount, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [candidate, live]
        modelId:
          type: integer
          nullable: true
        reason:
          type: string
        nodeCount:
          type: integer
        edgeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
