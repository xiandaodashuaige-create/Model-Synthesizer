          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"
    patch:
      operationId: updateLiveModelNodePosition
      tags: [live-model]
      summary: Update the canvas position of a live-model node (drag-to-reposition).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
