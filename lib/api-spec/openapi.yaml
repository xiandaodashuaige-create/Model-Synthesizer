            schema:
              type: object
              required: [positionX, positionY]
              properties:
                positionX:
                  type: number
                positionY:
                  type: number
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/edges:
    post:
      operationId: addLiveModelEdge
      tags: [live-model]
      summary: Add an edge to the live model. Must have provenance (paperId+citationText) OR be userAdded=true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromVariableId, toVariableId, relationship]
              properties:
                fromVariableId:
                  type: integer
                toVariableId:
                  type: integer
                relationship:
                  type: string
                  enum: [positive, negative, mediates, moderates]
                provenancePaperId:
                  type: integer
                  nullable: true
                provenanceCitationText:
                  type: string
                  nullable: true
                provenanceFigureThumbnailUrl:
                  type: string
                  nullable: true
                provenanceFigureSourceUrl:
                  type: string
                  nullable: true
                provenanceFigureSourceDomain:
                  type: string
                  nullable: true
                confidence:
                  type: string
                  enum: [high, medium, low]
                  default: medium
                sourceModelId:
                  type: integer
                  nullable: true
                userAdded:
                  type: boolean
                  default: false
                moderatesEdgeId:
                  type: integer
                  nullable: true
                  description: Required only when relationship="moderates" AND the user dropped the connection on an existing edge. Points to the edge being moderated; the canvas uses it to route the arrow to that edge's midpoint.
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/edges/{edgeId}:
    delete:
      operationId: removeLiveModelEdge
      tags: [live-model]
      summary: Remove an edge from the live model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: edgeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/models/{modelId}/evidence-search:
    post:
      operationId: searchModelEvidence
      tags: [evidence]
      summary: Find papers (in session library and/or via web search) that support each edge of an AI candidate model. Read-only — no DB writes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSearchRequest"
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSearchResult"

  /sessions/{id}/models/{modelId}/evidence-apply:
    post:
      operationId: applyModelEvidence
      tags: [evidence]
      summary: Snapshot the current model, add chosen web papers to the session library, and attach evidence to candidate-model edges. Returns the updated model.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceApplyRequest"
      responses:
        "200":
          description: Updated candidate model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/models/{modelId}/versions:
    get:
      operationId: listModelVersions
      tags: [evidence]
      summary: List recent saved snapshots of this candidate model (most recent first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersionSummary"

  /sessions/{id}/models/{modelId}/revert/{versionId}:
    post:
      operationId: revertModelToVersion
      tags: [evidence]
      summary: Restore the candidate model from a saved snapshot (also snapshots the current state first so the revert itself is undoable).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: modelId, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reverted candidate model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/live-model/evidence-search:
    post:
      operationId: searchLiveModelEvidence
      tags: [evidence]
      summary: Find papers (library and/or web) that support each edge of the user's live model. Read-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSearchRequest"
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSearchResult"

  /sessions/{id}/live-model/evidence-apply:
    post:
      operationId: applyLiveModelEvidence
      tags: [evidence]
      summary: Snapshot the current live model, import chosen web papers into the session library, and attach evidence to live-model edges.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceApplyRequest"
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/versions:
    get:
      operationId: listLiveModelVersions
      tags: [evidence]
      summary: List recent saved snapshots of the live model.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersionSummary"

  /sessions/{id}/live-model/revert/{versionId}:
    post:
      operationId: revertLiveModelToVersion
      tags: [evidence]
      summary: Restore the live model from a saved snapshot.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reverted live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

  /sessions/{id}/live-model/import-from-model:
    post:
      operationId: importLiveModelFromModel
      tags: [live-model]
      summary: One-click import all nodes+edges from an AI candidate model into the live model (preserves provenance)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: integer
                replace:
                  type: boolean
                  default: false
                  description: If true, clears existing nodes/edges before importing.
      responses:
        "200":
          description: Updated live model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveModelDetail"

components:
  schemas:
    PaperRelevanceScore:
      type: object
      required: [paperId, title, relevanceScore, recommendation, reason]
      properties:
        paperId:
          type: integer
        title:
          type: string
        relevanceScore:
          type: integer
          minimum: 0
          maximum: 100
        recommendation:
          type: string
          enum: [include, borderline, exclude]
        reason:
          type: string
    GenerationReadinessError:
      type: object
      required: [code, message, issues]
      properties:
        code:
          type: string
          enum: [generation_material_insufficient]
        message:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        candidateDvs:
          type: array
          items:
            type: object
            required: [id, name, paperCount]
            properties:
              id:
                type: integer
              name:
                type: string
              paperCount:
                type: integer
        recommendedActions:
          type: array
          items:
            type: string
    ReadinessIssue:
      type: object
      required: [type, severity, message]
      properties:
        type:
          type: string
          enum:
            - no_iv
            - no_dv
            - too_many_dvs
            - low_paper_count
            - all_single_paper_variables
            - no_cross_paper_overlap
            - no_construct_relationships
            - domain_mismatch_suspected
        severity:
          type: string
          enum: [blocking, warning]
        message:
          type: string
        detail:
          type: string
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AiUsageSummary:
      type: object
      required: [totalCalls, totalPromptTokens, totalCompletionTokens, totalTokens, totalCostUsd, flagshipCostUsd, savedCostUsd, byRoute]
      properties:
        totalCalls: { type: integer }
        totalPromptTokens: { type: integer }
        totalCompletionTokens: { type: integer }
        totalTokens: { type: integer }
        totalCostUsd: { type: number }
        flagshipCostUsd: { type: number, description: "Hypothetical USD cost if every call had been billed at the flagship gpt-5.4 rate." }
        savedCostUsd: { type: number, description: "USD saved by routing eligible tasks to cheaper models (flagship − actual, clamped at 0)." }
        byRoute:
          type: array
          items:
            type: object
            required: [route, calls, promptTokens, completionTokens, totalTokens, costUsd, flagshipCostUsd, savedCostUsd]
            properties:
              route: { type: string }
              calls: { type: integer }
              promptTokens: { type: integer }
              completionTokens: { type: integer }
              totalTokens: { type: integer }
              costUsd: { type: number }
              flagshipCostUsd: { type: number }
              savedCostUsd: { type: number }
    UserPersonalization:
      type: object
      required: [profile, counters, lastRefreshedAt]
      properties:
        lastRefreshedAt: { type: string }
        counters:
          type: object
          required: [sessions, papers, modelsGenerated, modelsAccepted, chatTurns]
          properties:
            sessions: { type: integer }
            papers: { type: integer }
            modelsGenerated: { type: integer }
            modelsAccepted: { type: integer }
            chatTurns: { type: integer }
        profile:
          type: object
          required:
            - topVariableTypes
            - topDomainKeywords
            - topAcceptedBackbones
            - topAcceptedOperators
            - preferredLanguage
            - avgVariablesPerAcceptedModel
            - avgEdgesPerAcceptedModel
            - acceptanceRate
            - recentTopics
          properties:
            preferredLanguage: { type: string, enum: [zh, en, mixed] }
            avgVariablesPerAcceptedModel: { type: number }
            avgEdgesPerAcceptedModel: { type: number }
            acceptanceRate: { type: number }
            recentTopics:
              type: array
              items: { type: string }
            topVariableTypes:
              type: array
              items:
                type: object
                required: [type, count]
                properties:
                  type: { type: string }
                  count: { type: integer }
            topDomainKeywords:
              type: array
              items:
                type: object
                required: [token, count]
                properties:
                  token: { type: string }
                  count: { type: integer }
            topAcceptedBackbones:
              type: array
              items:
                type: object
                required: [id, count]
                properties:
                  id: { type: string }
                  count: { type: integer }
            topAcceptedOperators:
              type: array
              items:
                type: object
                required: [op, count]
                properties:
                  op: { type: string }
                  count: { type: integer }
    PaperFullTextHit:
      type: object
      required: [id, title, snippet, rank]
      properties:
        id: { type: integer }
        title: { type: string }
        authors:
          type: array
          items: { type: string }
        year: { type: [integer, "null"] }
        snippet: { type: string }
        rank: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Session:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [searching, extracting, generating, complete]
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - topic
        - status
        - paperCount
        - variableCount
        - modelCount
        - createdAt
        - updatedAt

    CreateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string
      required:
        - name
        - topic

    UpdateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string

    SessionSummary:
      type: object
      properties:
        sessionId:
          type: integer
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        independentVarCount:
          type: integer
        mediatorVarCount:
          type: integer
        moderatorVarCount:
          type: integer
        dependentVarCount:
          type: integer
        selectedModelId:
          type: ["integer", "null"]
      required:
        - sessionId
        - paperCount
        - variableCount
        - modelCount
        - independentVarCount
        - mediatorVarCount
        - moderatorVarCount
        - dependentVarCount
        - selectedModelId

    SearchPapersBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: Page size, capped at the OpenAlex per-page max of 50.
        sort:
          type: string
          enum: [relevance, year, citations]
          description: Result ordering (default relevance)
        page:
          type: integer
          minimum: 1
          description: 1-based page number for pagination (default 1)
      required:
        - query

    LookupPaperBody:
      type: object
      properties:
        identifier:
          type: string
          description: A DOI, OpenAlex ID, arXiv ID, or paper URL
      required:
        - identifier

    BulkImportPapersBody:
      type: object
      properties:
        content:
          type: string
          description: Raw BibTeX or RIS file content (as exported from CNKI / WoS / Scopus / Zotero / EndNote)
      required:
        - content

    BulkImportPapersResponse:
      type: object
      properties:
        importedCount:
          type: integer
        skippedCount:
          type: integer
          description: Already existed in the session
        failedCount:
          type: integer
        totalDois:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: string
              reason:
                type: string
            required: [identifier, reason]
      required:
        - importedCount
        - skippedCount
        - failedCount
        - totalDois
        - failures

    PaperSearchResult:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    Paper:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
        sourceType:
          type: ["string", "null"]
          description: "Document source type. 'academic' (default) = OpenAlex / PDF paper. Others: 'industry_report', 'gov_report', 'whitepaper', 'other' = manually-added external documents."
          enum: [academic, industry_report, gov_report, whitepaper, other, null]
        extracted:
          type: boolean
        relevanceSkipped:
          type: boolean
          description: True when the paper was skipped by the mini relevance preflight (out_of_scope verdict). extracted will be false for these papers. The user can force re-extraction by calling the extract endpoint with bypassPreflight=true.
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - externalId
        - title
        - authors
        - url
        - extracted
        - relevanceSkipped
        - createdAt

    IndustrySearchBody:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Search keywords, e.g. "新能源汽车行业 消费者行为"
        sourceFilter:
          type: string
          enum: [all, gov, org, think_tank]
          default: all
          description: "Filter by source type: 'gov' = government domains, 'org' = associations/standards bodies, 'think_tank' = research institutes. Default: all."

    IndustrySearchResult:
      type: object
      required: [id, title, url, domain, relevanceScore, keyVariables, summary, bodyFetchFailed]
      properties:
        id:
          type: string
          description: Stable identifier derived from the URL (used as dedup key when importing).
        title:
          type: string
        url:
          type: string
        domain:
          type: string
        publishDate:
          type: ["string", "null"]
          description: Publication date string extracted from the search result metadata, if available.
        snippet:
          type: ["string", "null"]
          description: Raw search engine snippet.
        relevanceScore:
          type: integer
          minimum: 0
          maximum: 100
          description: AI-assigned relevance score (0–100) relative to the session research topic.
        keyVariables:
          type: array
          items:
            type: string
          description: 2–3 key construct names extracted by the AI from the document body.
        summary:
          type: string
          description: AI-generated 1–2 sentence summary of how this document relates to the research topic.
        bodyFetchFailed:
          type: boolean
          description: True when the page body could not be fetched or parsed; scoring was done from snippet only.

    AddExternalPaperBody:
      type: object
      required: [title, sourceType]
      properties:
        title:
          type: string
          description: Document title (required).
        sourceOrg:
          type: ["string", "null"]
          description: Issuing organization (e.g. "McKinsey", "国家统计局").
        year:
          type: ["integer", "null"]
          description: Publication year.
        sourceType:
          type: string
          enum: [industry_report, gov_report, whitepaper, other]
          description: Document type — one of industry_report / gov_report / whitepaper / other.
        abstract:
          type: ["string", "null"]
          description: Short summary or executive summary of the document.
        fullText:
          type: ["string", "null"]
          description: Key text content pasted by the user. Used by variable extraction instead of abstract when present. Stored as-is (no parsing).

    AddPaperBody:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    ExtractionResult:
      type: object
      required: [variables]
      properties:
        variables:
          type: array
          items:
            $ref: "#/components/schemas/Variable"
        skipped:
          type: boolean
          description: True when the paper was skipped because it is out of scope for the session topic. The full extraction pipeline was not run.
        skipReason:
          type: string
          enum: [out_of_scope]
          description: Machine-readable reason for the skip (only present when skipped is true).

    Variable:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        name:
          type: string
        type:
          type: string
          enum: [independent, mediator, moderator, dependent]
        definition:
          type: string
        citationText:
          type: string
        canonicalConstructId:
          type: ["string", "null"]
          description: Lower-case canonical construct id (e.g. "trust", "purchase intention"). Variables across papers that map to the same construct share this id.
        constructLayer:
          type: ["string", "null"]
          enum: [stimulus, cognitive, affective, intention, behavior, null]
          description: Standard psychology pipeline layer for the variable.
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - paperId
        - paperTitle
        - paperAuthors
        - name
        - type
        - definition
        - citationText
        - createdAt

    ImageBlocklistEntry:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        sourceUrl:
          type: string
        sourceDomain:
          type: string
        title:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - sourceUrl
        - sourceDomain
        - createdAt

    VariableGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
      required:
        - nodes
        - edges

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        paperCount:
          type: integer
      required:
        - id
        - label
        - type
        - paperCount

    GraphEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
        relationship:
          type: string
          enum: [positive, negative, moderates, mediates]
          description: Kind of directional relationship the paper states between source and target.
        statement:
          type: string
          description: Verbatim sentence from the paper supporting this edge.
      required:
        - source
        - target
        - paperId
        - paperTitle
        - relationship
        - statement

    ResearchModel:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        name:
          type: string
        description:
          type: string
        rationale:
          type: string
        selected:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ModelNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ModelEdge"
        partialPassMeta:
          nullable: true
          description: |
            Present only when this model was generated through the partial-pass flow
            (some session papers had not been extracted at generation time).
          type: object
          properties:
            allowPartial:
              type: boolean
            basedOnPaperIds:
              type: array
              items:
                type: integer
            missingPaperIds:
              type: array
              items:
                type: integer
            missingPapers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                required: [id, title]
          required: [allowPartial, basedOnPaperIds, missingPaperIds, missingPapers]
        innovationMeta:
          nullable: true
          description: |
            Phase 2 Innovation Layer scoring + provenance. Always written for
            models generated after Phase 2 ships; null for older models.
            `mode='analysis_only'` means the score is descriptive — the system
            will not reject the model on it. `stale=true` means the score was
            computed against an older landscape version and should be
            recomputed before being trusted for hard decisions.
          allOf:
            - $ref: "#/components/schemas/InnovationMeta"
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - name
        - description
        - rationale
        - selected
        - nodes
        - edges
        - createdAt

    LandscapeCoverage:
      type: object
      description: |
        How much of the session's eligible literature pool has been extracted
        with Phase 1 innovation fields. Drives the Landscape page banner and
        gates `InnovationMeta.mode` (below 0.7 → analysis_only).
      properties:
        coverageRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: extractedWithInnovationFieldsCount / totalEligiblePaperCount
        totalEligiblePaperCount:
          type: integer
          minimum: 0
          description: Non-tangential, non-manual papers in the session.
        extractedWithInnovationFieldsCount:
          type: integer
          minimum: 0
      required: [coverageRate, totalEligiblePaperCount, extractedWithInnovationFieldsCount]

    LandscapeRelationshipRow:
      type: object
      description: |
        One aggregated `constructRelationships` row, shaped for the
        Landscape page table. Mirrors the DB row but drops verbose
        per-paper evidence (the page only renders aggregate counts and
        first/last year).
      properties:
        id:
          type: integer
        canonicalFrom:
          type: string
        canonicalTo:
          type: string
        contextQualifierFrom:
          type: string
          nullable: true
        contextQualifierTo:
          type: string
          nullable: true
        relationshipType:
          type: string
          enum: [direct, mediation, moderation]
        sign:
          type: string
          enum: [positive, negative, mixed, none]
        signConflict:
          type: boolean
        totalOccurrences:
          type: integer
          minimum: 0
        domainsCovered:
          type: array
          items:
            type: string
        earliestYear:
          type: integer
          nullable: true
        latestYear:
          type: integer
          nullable: true
        noveltyPotentialScore:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - id
        - canonicalFrom
        - canonicalTo
        - relationshipType
        - sign
        - signConflict
        - totalOccurrences
        - domainsCovered
        - noveltyPotentialScore

    TheoryClusterRow:
      type: object
      description: One entry from `landscapeMeta.theoryClusters`.
      properties:
        id:
          type: string
        label:
          type: string
        theoryIds:
          type: array
          items:
            type: string
        paperCount:
          type: integer
          minimum: 0
      required: [id, label, theoryIds, paperCount]

    SufficiencyCheck:
      type: object
      description: |
        Pure-algorithm literature sufficiency rating computed inside
        `GET /sessions/{id}/landscape`. No AI is called — all dimensions are
        derived from data already in the DB. Uses the weakest-link (木桶)
        principle: overall `rating` is the minimum of all four dimension ratings.
      properties:
        rating:
          type: string
          enum: [minimal, fair, sufficient]
          description: Overall rating — minimum across all four dimensions.
        paperCount:
          type: integer
          description: Number of in-scope (non-manual, non-tangential) papers.
        recentRatio:
          type: number
          description: |
            Fraction of papers (with known year) published in the last 5 years.
            Range 0–1. Rounded to 2 decimal places.
        recentRatioKnownBase:
          type: integer
          description: |
            Count of papers that have a known publication year (denominator for
            `recentRatio`). If this is much less than `paperCount`, interpret
            `recentRatio` cautiously.
        theoryCount:
          type: integer
          description: Number of distinct theory backbone names cited across all in-scope papers.
        coverageRate:
          type: number
          description: Same as `coverage.coverageRate` — fraction of eligible papers that contributed innovation fields.
        hasYearDataGap:
          type: boolean
          description: True when fewer than 50% of in-scope papers have a known publication year.
        suggestedSearchTerms:
          type: array
          description: 3–5 rule-generated English search terms for supplementing the corpus.
          items:
            type: string
        dimensionRatings:
          type: object
          description: Per-dimension ratings used to derive the overall rating.
          properties:
            paperCount:
              type: string
              enum: [minimal, fair, sufficient]
            recentRatio:
              type: string
              enum: [minimal, fair, sufficient]
            theoryCount:
              type: string
              enum: [minimal, fair, sufficient]
            coverageRate:
              type: string
              enum: [minimal, fair, sufficient]
          required: [paperCount, recentRatio, theoryCount, coverageRate]
      required:
        - rating
        - paperCount
        - recentRatio
        - recentRatioKnownBase
        - theoryCount
        - coverageRate
        - hasYearDataGap
        - suggestedSearchTerms
        - dimensionRatings

    SessionLandscape:
      type: object
      description: |
        Read model returned by `GET /sessions/{id}/landscape`. Combines the
        coverage banner inputs with the full relationship table and the
        theory-cluster + evidenced-backbone summaries. `landscapeVersion`
        is null until the first `rebuildLandscape()` runs for the session.
      properties:
        landscapeVersion:
          type: integer
          nullable: true
        lastRebuildAt:
          type: string
          nullable: true
          description: ISO timestamp of the most recent rebuild.
        coverage:
          $ref: "#/components/schemas/LandscapeCoverage"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/LandscapeRelationshipRow"
        theoryClusters:
          type: array
          items:
            $ref: "#/components/schemas/TheoryClusterRow"
        evidencedBackbones:
          type: array
          description: |
            Distinct theory names mentioned by at least one in-scope paper's
            `theoryBackbone`. Lower-cased, de-duplicated, sorted.
          items:
            type: string
        sufficiency:
          $ref: "#/components/schemas/SufficiencyCheck"
          description: Pure-algorithm literature sufficiency rating. Always present.
        gapReport:
          nullable: true
          description: |
            Cached AI-generated gap report for this session. Null until
            `POST /sessions/{id}/landscape/gap-report` is called.
          allOf:
            - $ref: "#/components/schemas/GapReport"
      required:
        - landscapeVersion
        - lastRebuildAt
        - coverage
        - relationships
        - theoryClusters
        - evidencedBackbones
        - sufficiency

    GapReportGap:
      type: object
      description: A single identified research gap.
      properties:
        type:
          type: string
          enum: [mechanism, boundary, integration, correction, construct, context]
          description: Gap category per docs/innovation-taxonomy.md.
        summary:
          type: string
          description: One-sentence description of the gap (zh-CN).
        evidence:
          type: string
          description: Which relationships or papers support this gap claim (zh-CN).
      required: [type, summary, evidence]

    GapReport:
      type: object
      description: |
        AI-generated per-session research gap report. Cached in
        `sessions.landscapeMeta.gapReport`, keyed by `landscapeVersion`.
        Regenerated by `POST /sessions/{id}/landscape/gap-report` after a landscape rebuild.
      properties:
        version:
          type: integer
          description: The `landscapeVersion` this report was computed against.
        generatedAt:
          type: string
          description: ISO timestamp when the report was generated.
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/GapReportGap"
        topGapTypes:
          type: array
          description: Top 1–3 most significant gap types (subset of allGapTypes).
          items:
            type: string
        allGapTypes:
          type: array
          description: All gap types that were detected.
          items:
            type: string
      required: [version, generatedAt, gaps, topGapTypes, allGapTypes]

    EdgeMatchedRelationship:
      type: object
      description: |
        Snapshot of the `constructRelationships` row that an edge matched
        against during scoring. Carried on every `EdgeNoveltyTag` so the UI
        can explain *why* a particular tag was picked (or not picked) without
        round-tripping to the DB. Null when no row matched.
      properties:
        canonicalFrom:
          type: string
        canonicalTo:
          type: string
        relationshipType:
          type: string
          enum: [direct, mediation, moderation]
        totalOccurrences:
          type: integer
          minimum: 0
          description: Distinct in-scope papers this relationship appears in.
        signConflict:
          type: boolean
        domainsCovered:
          type: array
          items:
            type: string
      required: [canonicalFrom, canonicalTo, relationshipType, totalOccurrences, signConflict, domainsCovered]

    EdgeNoveltyTag:
      type: object
      description: |
        Per-edge novelty classification with explainability payload.
        `tag` follows the single-pick precedence order:
        contradicting > mechanism_inserted > boundary_extended >
        context_transferred > novel > underexplored > established > saturated.
      properties:
        edgeIndex:
          type: integer
          minimum: 0
          description: Index into the parent model's `edges` array.
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
          description: Raw model edge relationship (positive / negative / mediates / moderates).
        tag:
          type: string
          enum:
            - saturated
            - established
            - underexplored
            - context_transferred
            - novel
            - mechanism_inserted
            - boundary_extended
            - contradicting
        subscore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            The actual subscore contributed to `noveltyScore`. For
            `contradicting` this is 80 by default and 95 when the model also
            contains a moderator/mediator that resolves the conflict.
        matchedTotalOccurrences:
          type: integer
          nullable: true
          description: Convenience copy of `matchedRelationship.totalOccurrences`.
        matchedRelationship:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EdgeMatchedRelationship"
        reason:
          type: string
          description: |
            zh-CN human-readable explanation of why this tag was chosen.
            Stable enough that the UI can display it directly. Includes the
            specific occurrence count when available so the user understands
            why an edge stayed `novel` instead of being upgraded to
            `boundary_extended` (e.g. "主路径仅在 2 篇文献中出现…").
      required: [edgeIndex, fromVariableName, toVariableName, relationship, tag, subscore, matchedTotalOccurrences, matchedRelationship, reason]

    InnovationSubScores:
      type: object
      properties:
        differentiation:
          type: integer
          minimum: 0
          maximum: 100
          description: Mean of edge subscores. Reflects how novel the edges are vs. the literature.
        gapFit:
          type: integer
          minimum: 0
          maximum: 100
          description: Floor 30 in slice 1; full computation in Phase 2.x once contributionStatement.gapTypes wires in.
        theoreticalSoundness:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 if the model's backbone is in the session's evidenced backbones, else floor 30.
        evidenceSupport:
          type: integer
          minimum: 0
          maximum: 100
          description: Floor 20 in slice 1; tiered (direct/analog/theory) in Phase 2.x.
      required: [differentiation, gapFit, theoreticalSoundness, evidenceSupport]

    InnovationWarning:
      type: object
      properties:
        code:
          type: string
          enum:
            - contribution_statement_missing
            - no_innovation_type_detected
            - all_edges_low_novelty
        message:
          type: string
      required: [code, message]

    ContributionStatement:
      type: object
      description: |
        Phase 3 AI-emitted 7-field structured self-explanation of why a model
        constitutes a theoretical contribution. Null until `generate-contribution`
        is called; afterwards all 8 fields are non-empty.
      properties:
        whatIsKnown:
          type: string
          description: One sentence summarizing what the existing literature already establishes.
        whatIsMissing:
          type: string
          description: One sentence on the gap this model addresses.
        whatThisAdds:
          type: string
          description: One sentence on what this model structurally adds.
        whyItMatters:
          type: string
          description: One sentence on the theoretical significance.
        researchGapClaim:
          type: string
          description: Explicit claim statement (≤ 40 words, academic tone).
        theoreticalContribution:
          type: string
          description: Summary contribution statement suitable for an abstract.
        gapTypes:
          type: array
          items:
            type: string
          description: Gap types this model addresses (subset of the 6 innovation types).
        contributionType:
          type: string
          description: Single dominant contribution type label (e.g. "mechanism", "boundary").
      required:
        - whatIsKnown
        - whatIsMissing
        - whatThisAdds
        - whyItMatters
        - researchGapClaim
        - theoreticalContribution
        - gapTypes
        - contributionType

    ReviewerDimension:
      type: object
      properties:
        dimension:
          type: string
          enum: [gap, novelty, evidence, coverage, statement]
        label:
          type: string
          description: zh-CN display label for the dimension.
        status:
          type: string
          enum: [ok, warn, fail]
        message:
          type: string
          description: zh-CN human-readable diagnostic message.
      required: [dimension, label, status, message]

    ReviewerReport:
      type: object
      description: Rule-based reviewer report (zero AI cost). 5 dimensions evaluated from `innovationMeta`.
      properties:
        modelId:
          type: integer
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerDimension"
          minItems: 5
          maxItems: 5
        overallStatus:
          type: string
          enum: [ok, warn, fail]
          description: Worst status across all 5 dimensions.
      required: [modelId, dimensions, overallStatus]

    AiReviewResult:
      type: object
      description: AI deep-review narrative (gpt-5-mini, Markdown).
      properties:
        markdown:
          type: string
          description: Reviewer-persona commentary in Markdown (max ~1 200 tokens).
      required: [markdown]

    InnovationMeta:
      type: object
      description: |
        Phase 2 Innovation Layer scoring + provenance for a single research
        model. NEVER causes hard rejection — `mode='analysis_only'` is the
        contract for the whole slice 1 release. The UI MUST display all four
        sub-scores and surface `warnings` non-modally.
      properties:
        edgeNoveltyTags:
          type: array
          items:
            $ref: "#/components/schemas/EdgeNoveltyTag"
          description: One entry per edge in the parent model, parallel by index.
        noveltyScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Mean of `edgeNoveltyTags[].subscore`. Null only when the model has zero edges.
        innovationTypes:
          type: array
          items:
            type: string
            enum: [mechanism, boundary, integration, correction, construct, context]
          description: 5 of 6 auto-detected from the landscape; `context` joins in Phase 3 via AI.
        subScores:
          $ref: "#/components/schemas/InnovationSubScores"
        contributionScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Headline number — geometric mean of the 4 sub-scores.
        contributionStatement:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ContributionStatement"
          description: |
            Phase 3 AI-emitted 7-field self-explanation. Null until
            `generate-contribution` is called.
        aiReviewMarkdown:
          type: string
          nullable: true
          description: |
            AI deep-review Markdown generated by `ai-review`. Null until
            that endpoint is called; persisted so page reloads skip re-generation.
        computedAgainst:
          type: object
          properties:
            landscapeVersion:
              type: integer
              nullable: true
              description: Session's `landscapeMeta.landscapeVersion` at compute time.
            coverageRate:
              type: number
              format: float
              minimum: 0
              maximum: 1
            computedAt:
              type: string
              format: date-time
          required: [landscapeVersion, coverageRate, computedAt]
        mode:
          type: string
          enum: [analysis_only, enforced]
        modeReason:
          type: string
          enum: [coverage_below_threshold, ok]
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/InnovationWarning"
        stale:
          type: boolean
          description: |
            True iff the score was computed against an older
            `landscapeVersion` than the session currently has. Decorated by
            the formatter at read time; not persisted in the JSONB.
      required:
        - edgeNoveltyTags
        - noveltyScore
        - innovationTypes
        - subScores
        - contributionScore
        - contributionStatement
        - computedAgainst
        - mode
        - modeReason
        - warnings

    ModelNode:
      type: object
      properties:
        variableId:
          type: integer
        variableName:
          type: string
        type:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        positionX:
          type: ["number", "null"]
          description: User-arranged X position on the editable canvas (null = use auto layout).
        positionY:
          type: ["number", "null"]
          description: User-arranged Y position on the editable canvas (null = use auto layout).
      required:
        - variableId
        - variableName
        - type
        - paperId
        - paperTitle
        - paperAuthors

    ModelEdge:
      type: object
      properties:
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        evidencePaperId:
          type: integer
        evidencePaperTitle:
          type: string
        evidencePaperAuthors:
          type: array
          items:
            type: string
        evidencePaperYear:
          type: ["integer", "null"]
        evidenceCitationText:
          type: string
        evidenceHypothesisId:
          type: ["string", "null"]
          description: References paper_hypotheses.hypothesis_id (e.g. "H2a") when the edge is grounded in a formal hypothesis.
        effectSize:
          type: ["string", "null"]
          description: Reported effect size (e.g. "β=.34, p<.001") when extracted from the source paper.
        evidenceLocation:
          type: ["string", "null"]
          description: Where in the source paper the edge is supported (e.g. "p. 412", "Section 3.2").
        moderatorJustification:
          type: ["string", "null"]
          description: REQUIRED when relationship="moderates". Explains theoretically why the variable can condition the moderated path.
        additionalEvidence:
          type: array
          description: Extra supporting papers attached after-the-fact via the AI evidence-matching feature.
          items:
            $ref: "#/components/schemas/AdditionalEvidence"
      required:
        - fromVariableId
        - toVariableId
        - fromVariableName
        - toVariableName
        - relationship
        - evidencePaperId
        - evidencePaperTitle
        - evidencePaperAuthors
        - evidenceCitationText

    AdditionalEvidence:
      type: object
      required: [paperId, paperTitle, citationText, source]
      properties:
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        citationText:
          type: string
        source:
          type: string
          enum: [library, web]
        score:
          type: ["number", "null"]
        addedAt:
          type: string
          format: date-time

    LiveModelNodeOut:
      type: object
      properties:
        id:
          type: integer
        variableId:
          type: integer
        variableName:
          type: string
        variableType:
          type: string
        paperId:
          type: integer
        sourceModelId:
          type: ["integer", "null"]
        userAdded:
          type: boolean
        positionX:
          type: ["number", "null"]
          description: User-arranged X position on the editable canvas (null = use auto layout).
        positionY:
          type: ["number", "null"]
          description: User-arranged Y position on the editable canvas (null = use auto layout).
        createdAt:
          type: string
      required:
        - id
        - variableId
        - variableName
        - variableType
        - paperId
        - userAdded
        - createdAt

    LiveModelEdgeOut:
      type: object
      properties:
        id:
          type: integer
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        provenancePaperId:
          type: ["integer", "null"]
        provenancePaperTitle:
          type: ["string", "null"]
        provenanceCitationText:
          type: ["string", "null"]
        provenanceFigureThumbnailUrl:
          type: ["string", "null"]
        provenanceFigureSourceUrl:
          type: ["string", "null"]
        provenanceFigureSourceDomain:
          type: ["string", "null"]
        confidence:
          type: string
        sourceModelId:
          type: ["integer", "null"]
        userAdded:
          type: boolean
        moderatesEdgeId:
          type: ["integer", "null"]
          description: When relationship="moderates", optionally points to another edge that this edge moderates. The canvas reroutes the moderator's arrow tip to land on the midpoint of the referenced edge.
        hasProvenance:
          type: boolean
          description: True if a paperId+citationText backs this edge.
        additionalEvidence:
          type: array
          items:
            $ref: "#/components/schemas/AdditionalEvidence"
        createdAt:
          type: string
      required:
        - id
        - fromVariableId
        - toVariableId
        - fromVariableName
        - toVariableName
        - relationship
        - confidence
        - userAdded
        - hasProvenance
        - createdAt

    LiveModelDetail:
      type: object
      properties:
        liveModel:
          type: object
          properties:
            id:
              type: integer
            sessionId:
              type: integer
            notes:
              type: string
            version:
              type: integer
            createdAt:
              type: string
            updatedAt:
              type: string
          required: [id, sessionId, notes, version, createdAt, updatedAt]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/LiveModelNodeOut"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/LiveModelEdgeOut"
        unsupportedEdgeCount:
          type: integer
          description: Number of edges with no provenance (paper backing) — UI should warn.
      required:
        - liveModel
        - nodes
        - edges
        - unsupportedEdgeCount

    EvidenceSearchRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [library, web, scholar]
          default: [library, web]
          description: Where to look. `library` = papers in this session. `web` = OpenAlex. `scholar` = Google Scholar via SerpAPI.
        granularity:
          type: array
          items:
            type: string
            enum: [overall, per-edge]
          default: [overall, per-edge]
        instructions:
          type: string
          nullable: true
          description: Optional natural-language guidance from the user (e.g. "prefer recent meta-analyses").
        focusEdgeKey:
          type: string
          nullable: true
          description: When provided, restrict the search to ONLY this edge. Other edges in the model are ignored, the AI prompt is much smaller, and overall-granularity is suppressed. Used by the per-edge "搜索出处" entry point on the live model page.
        includeImages:
          type: boolean
          nullable: true
          description: When true, also include up to 3 figure thumbnails per edge (SerpAPI google_images). Defaults to true when focusEdgeKey is set.

    EvidenceImageHit:
      type: object
      required: [thumbnailUrl, sourceUrl, sourceDomain]
      properties:
        title:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
        imageUrl:
          type: string
          nullable: true
        sourceUrl:
          type: string
        sourceDomain:
          type: string

    EvidencePaperHit:
      type: object
      required: [source, title, authors, score, rationale]
      properties:
        source:
          type: string
          enum: [library, web, scholar]
        paperId:
          type: integer
          nullable: true
          description: Present when source=library.
        externalId:
          type: string
          nullable: true
          description: OpenAlex W-id when source=web.
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
          nullable: true
        abstract:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        score:
          type: number
          description: AI-assessed relevance, 0..1.
        rationale:
          type: string
          description: Short why-this-matches.
        evidenceQuote:
          type: string
          nullable: true
          description: Verbatim sentence supporting the matched edge (per-edge hits only).

    EvidenceEdgeMatch:
      type: object
      required: [edgeKey, fromVariableName, toVariableName, relationship, hits]
      properties:
        edgeKey:
          type: string
          description: Stable identifier "fromVariableId-toVariableId-relationship".
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        hits:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePaperHit"
        imageHits:
          type: array
          description: Optional figure thumbnails returned when includeImages=true (or when focused on a single edge).
          items:
            $ref: "#/components/schemas/EvidenceImageHit"

    EvidenceSearchResult:
      type: object
      required: [overallMatches, perEdgeMatches]
      properties:
        overallMatches:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePaperHit"
        perEdgeMatches:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEdgeMatch"
        durationMs:
          type: integer

    EvidenceApplyRequest:
      type: object
      properties:
        addPapers:
          type: array
          description: Web hits the user confirmed; will be imported into the session library if not already present.
          items:
            type: object
            required: [externalId, title]
            properties:
              externalId:
                type: string
              title:
                type: string
              authors:
                type: array
                items:
                  type: string
              year:
                type: integer
                nullable: true
              abstract:
                type: string
                nullable: true
              url:
                type: string
                nullable: true
        edgeAttachments:
          type: array
          items:
            type: object
            required: [edgeKey, evidenceQuote]
            properties:
              edgeKey:
                type: string
                description: "fromVariableId-toVariableId-relationship"
              paperId:
                type: integer
                nullable: true
                description: Library paper id; takes precedence over externalId.
              externalId:
                type: string
                nullable: true
                description: OpenAlex W-id for web hit; resolved against addPapers and the session library.
              evidenceQuote:
                type: string
        reason:
          type: string
          nullable: true
          description: Optional human-readable description of the change (shown in version history).

    ModelVersionSummary:
      type: object
      required: [id, kind, reason, nodeCount, edgeCount, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [candidate, live]
        modelId:
          type: integer
          nullable: true
        reason:
          type: string
        nodeCount:
          type: integer
        edgeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
