openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Research Model Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Research session management
  - name: papers
    description: Paper search and management
  - name: variables
    description: Variable extraction
  - name: models
    description: Research model generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all research sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new research session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session name or topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get session statistics summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /papers/search:
    post:
      operationId: searchPapers
      tags: [papers]
      summary: Search papers by topic from OpenAlex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPapersBody"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSearchResult"

  /papers/lookup:
    post:
      operationId: lookupPaper
      tags: [papers]
      summary: Look up a paper by DOI, URL, or OpenAlex ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupPaperBody"
      responses:
        "200":
          description: Paper found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperSearchResult"
        "404":
          description: Paper not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error

  /sessions/{id}/papers/bulk-import:
    post:
      operationId: bulkImportPapers
      tags: [papers]
      summary: Bulk-import papers from a BibTeX or RIS export
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportPapersBody"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportPapersResponse"

  /sessions/{id}/papers:
    get:
      operationId: listSessionPapers
      tags: [papers]
      summary: List papers added to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Papers in session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paper"
    post:
      operationId: addPaperToSession
      tags: [papers]
      summary: Add a paper to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPaperBody"
      responses:
        "201":
          description: Added paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"

  /sessions/{sessionId}/papers/{paperId}:
    delete:
      operationId: removePaperFromSession
      tags: [papers]
      summary: Remove a paper from a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/{paperId}/extract:
    post:
      operationId: extractVariables
      tags: [variables]
      summary: Extract research variables from a paper using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extracted variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"

  /sessions/{id}/variables:
    get:
      operationId: listSessionVariables
      tags: [variables]
      summary: List all extracted variables for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variables list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"

  /sessions/{id}/variable-graph:
    get:
      operationId: getVariableGraph
      tags: [variables]
      summary: Get variable relationship graph data for visualization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableGraph"

  /sessions/{id}/model-assistant:
    post:
      operationId: chatModelAssistant
      tags: [models]
      summary: Conversational assistant that helps the user shape model-generation directives based on their notes, files, and the session's papers/variables.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                      attachments:
                        type: array
                        items:
                          type: object
                          required: [name, kind, data]
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                              enum: [image, text]
                              description: image = base64 data URL; text = plain text (e.g. extracted from a PDF client-side)
                            data:
                              type: string
      responses:
        "200":
          description: Assistant reply, with optional one-click generation directive
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply:
                    type: string
                  suggestion:
                    type: object
                    properties:
                      userPrompt:
                        type: string
                      focusVariableIds:
                        type: array
                        items:
                          type: integer
                      requiredOperators:
                        type: array
                        items:
                          type: string
                  needsMorePapers:
                    type: object
                    description: Set when the AI judges the existing session materials are insufficient to answer the user's research question.
                    required: [reason]
                    properties:
                      reason:
                        type: string
                      searchQuery:
                        type: string
                      missingConstructs:
                        type: array
                        items:
                          type: string

  /sessions/{id}/model-assistant/search-model-images:
    post:
      operationId: searchModelImages
      tags: [models]
      summary: Search the web for research model / conceptual framework figures matching a topic. Returns thumbnails plus original page URLs so the user can quickly find the source paper.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Topic / construct to search for. The server will augment it with academic phrasing.
                count:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                type: object
                required: [results, query]
                properties:
                  query:
                    type: string
                    description: The augmented query actually sent to the search provider.
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, thumbnailUrl, sourceUrl, sourceDomain]
                      properties:
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                        imageUrl:
                          type: string
                        sourceUrl:
                          type: string
                        sourceDomain:
                          type: string
                        width:
                          type: integer
                        height:
                          type: integer
        "503":
          description: Search provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/generate:
    post:
      operationId: generateModels
      tags: [models]
      summary: Generate new research model combinations using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userPrompt:
                  type: string
                  description: Optional user-supplied direction/constraints/research focus to steer the AI
                numModels:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Number of model proposals to generate (default 3)
                focusVariableIds:
                  type: array
                  items:
                    type: integer
                  description: Variable IDs the user wants the AI to prioritize including
      responses:
        "200":
          description: Generated model combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/models:
    get:
      operationId: listSessionModels
      tags: [models]
      summary: List generated models for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/learning-stats:
    get:
      operationId: getSessionLearningStats
      tags: [models]
      summary: How many feedback rounds the AI has learned from for this session/global
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalFeedback:
                    type: integer
                  withSelections:
                    type: integer
                  withEdits:
                    type: integer
                required: [totalFeedback, withSelections, withEdits]

  /models/{id}:
    patch:
      operationId: updateModel
      tags: [models]
      summary: Update a model (user edits to name/description/rationale/nodes/edges)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rationale:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
    get:
      operationId: getModel
      tags: [models]
      summary: Get a specific research model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research model detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/select:
    post:
      operationId: selectModel
      tags: [models]
      summary: Mark a model as selected by the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Session:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [searching, extracting, generating, complete]
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - topic
        - status
        - paperCount
        - variableCount
        - modelCount
        - createdAt
        - updatedAt

    CreateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string
      required:
        - name
        - topic

    UpdateSessionBody:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string

    SessionSummary:
      type: object
      properties:
        sessionId:
          type: integer
        paperCount:
          type: integer
        variableCount:
          type: integer
        modelCount:
          type: integer
        independentVarCount:
          type: integer
        mediatorVarCount:
          type: integer
        moderatorVarCount:
          type: integer
        dependentVarCount:
          type: integer
        selectedModelId:
          type: ["integer", "null"]
      required:
        - sessionId
        - paperCount
        - variableCount
        - modelCount
        - independentVarCount
        - mediatorVarCount
        - moderatorVarCount
        - dependentVarCount
        - selectedModelId

    SearchPapersBody:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
      required:
        - query

    LookupPaperBody:
      type: object
      properties:
        identifier:
          type: string
          description: A DOI, OpenAlex ID, arXiv ID, or paper URL
      required:
        - identifier

    BulkImportPapersBody:
      type: object
      properties:
        content:
          type: string
          description: Raw BibTeX or RIS file content (as exported from CNKI / WoS / Scopus / Zotero / EndNote)
      required:
        - content

    BulkImportPapersResponse:
      type: object
      properties:
        importedCount:
          type: integer
        skippedCount:
          type: integer
          description: Already existed in the session
        failedCount:
          type: integer
        totalDois:
          type: integer
        failures:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: string
              reason:
                type: string
            required: [identifier, reason]
      required:
        - importedCount
        - skippedCount
        - failedCount
        - totalDois
        - failures

    PaperSearchResult:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    Paper:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
        extracted:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - externalId
        - title
        - authors
        - url
        - extracted
        - createdAt

    AddPaperBody:
      type: object
      properties:
        externalId:
          type: string
        title:
          type: string
        abstract:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        year:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        citationCount:
          type: ["integer", "null"]
        openAccessUrl:
          type: ["string", "null"]
        url:
          type: string
      required:
        - externalId
        - title
        - authors
        - url

    Variable:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
        name:
          type: string
        type:
          type: string
          enum: [independent, mediator, moderator, dependent]
        definition:
          type: string
        citationText:
          type: string
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - paperId
        - paperTitle
        - paperAuthors
        - name
        - type
        - definition
        - citationText
        - createdAt

    VariableGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
      required:
        - nodes
        - edges

    GraphNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        paperCount:
          type: integer
      required:
        - id
        - label
        - type
        - paperCount

    GraphEdge:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
      required:
        - source
        - target
        - paperId
        - paperTitle

    ResearchModel:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        name:
          type: string
        description:
          type: string
        rationale:
          type: string
        selected:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ModelNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ModelEdge"
        createdAt:
          type: string
      required:
        - id
        - sessionId
        - name
        - description
        - rationale
        - selected
        - nodes
        - edges
        - createdAt

    ModelNode:
      type: object
      properties:
        variableId:
          type: integer
        variableName:
          type: string
        type:
          type: string
        paperId:
          type: integer
        paperTitle:
          type: string
        paperAuthors:
          type: array
          items:
            type: string
        paperYear:
          type: ["integer", "null"]
      required:
        - variableId
        - variableName
        - type
        - paperId
        - paperTitle
        - paperAuthors

    ModelEdge:
      type: object
      properties:
        fromVariableId:
          type: integer
        toVariableId:
          type: integer
        fromVariableName:
          type: string
        toVariableName:
          type: string
        relationship:
          type: string
        evidencePaperId:
          type: integer
        evidencePaperTitle:
          type: string
        evidencePaperAuthors:
          type: array
          items:
            type: string
        evidencePaperYear:
          type: ["integer", "null"]
        evidenceCitationText:
          type: string
      required:
        - fromVariableId
        - toVariableId
        - fromVariableName
        - toVariableName
        - relationship
        - evidencePaperId
        - evidencePaperTitle
        - evidencePaperAuthors
        - evidenceCitationText
