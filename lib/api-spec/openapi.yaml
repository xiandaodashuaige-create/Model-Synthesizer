openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Research Model Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Research session management
  - name: papers
    description: Paper search and management
  - name: variables
    description: Variable extraction
  - name: models
    description: Research model generation
  - name: Auth
    description: Browser authentication
  - name: usage
    description: AI usage and cost tracking
  - name: personalization
    description: Per-user AI learning profile
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /sessions/{id}/ai-usage:
    get:
      tags: [usage]
      operationId: getSessionAiUsage
      summary: Aggregate AI usage and cost for this session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageSummary"
  /me/personalization:
    get:
      tags: [personalization]
      operationId: getMyPersonalization
      summary: Get the current user's AI personalization profile
      responses:
        "200":
          description: Profile (lazily refreshed if older than 1 hour)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPersonalization"
    delete:
      tags: [personalization]
      operationId: forgetMyPersonalization
      summary: Forget — delete the current user's personalization profile
      responses:
        "204":
          description: Profile deleted
  /me/personalization/refresh:
    post:
      tags: [personalization]
      operationId: refreshMyPersonalization
      summary: Force-recompute the personalization profile from history
      responses:
        "200":
          description: Refreshed profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPersonalization"
  /sessions/{id}/papers/full-text-search:
    get:
      tags: [papers]
      operationId: searchSessionPapersFullText
      summary: Postgres full-text search across this session's papers (title + abstract + fullText)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching papers with rank-ordered snippets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperFullTextHit"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all research sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new research session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session name or topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get session statistics summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /papers/search:
    post:
      operationId: searchPapers
      tags: [papers]
      summary: Search papers by topic from OpenAlex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPapersBody"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperSearchResult"

  /papers/lookup:
    post:
      operationId: lookupPaper
      tags: [papers]
      summary: Look up a paper by DOI, URL, or OpenAlex ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupPaperBody"
      responses:
        "200":
          description: Paper found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperSearchResult"
        "404":
          description: Paper not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error

  /sessions/{id}/papers/bulk-import:
    post:
      operationId: bulkImportPapers
      tags: [papers]
      summary: Bulk-import papers from a BibTeX or RIS export
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportPapersBody"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportPapersResponse"

  /sessions/{id}/papers:
    get:
      operationId: listSessionPapers
      tags: [papers]
      summary: List papers added to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Papers in session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paper"
    post:
      operationId: addPaperToSession
      tags: [papers]
      summary: Add a paper to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPaperBody"
      responses:
        "201":
          description: Added paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"

  /sessions/{sessionId}/papers/{paperId}:
    delete:
      operationId: removePaperFromSession
      tags: [papers]
      summary: Remove a paper from a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/{paperId}/extract:
    post:
      operationId: extractVariables
      tags: [variables]
      summary: Extract research variables from a paper using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
        - name: bypassPreflight
          in: query
          required: false
          schema:
            type: boolean
          description: When true, skip the mini relevance preflight and force full extraction regardless of topic relevance verdict.
      responses:
        "200":
          description: Extracted variables (or skipped if paper is out of scope for the session topic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"

  /sessions/{id}/variables:
    get:
      operationId: listSessionVariables
      tags: [variables]
      summary: List all extracted variables for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variables list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
    post:
      operationId: createSessionVariable
      tags: [variables]
      summary: Manually create a custom variable in this session (not extracted from a paper). Useful when the AI didn't surface a construct the researcher needs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  description: Variable display name (1–200 chars).
                type:
                  type: string
                  enum: [independent, mediator, moderator, dependent]
                definition:
                  type: string
                  description: Optional plain-language definition.
      responses:
        "201":
          description: Created variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        "400":
          description: Invalid name / type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/upload-pdf:
    post:
      operationId: uploadSessionPaperPdf
      tags: [papers]
      summary: Upload a PDF and add it to the session as a paper. Extracts metadata via DOI lookup or AI fallback; full text is stored for downstream variable extraction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF file (max ~25 MB; must be text-extractable, not a scan).
      responses:
        "201":
          description: Paper added to the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "200":
          description: Paper already in the session (idempotent on externalId / DOI). Returns the existing row, possibly with updated full text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "400":
          description: No file, unreadable PDF, or scanned document with no extractable text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not extract a usable title from the PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI metadata extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/external:
    post:
      operationId: addExternalPaper
      tags: [papers]
      summary: Add an external document (industry report, government file, whitepaper, etc.) to the session. The user supplies all metadata and content directly — no OpenAlex lookup.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExternalPaperBody"
      responses:
        "201":
          description: External document added to the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paper"
        "400":
          description: Validation error (e.g. missing title).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/papers/industry-search:
    post:
      operationId: industrySearchPapers
      tags: [papers]
      summary: Search public industry sources (government, associations, think tanks) for documents relevant to the session topic. Returns AI-scored results with key variable previews. Results are cached per session for 30 minutes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustrySearchBody"
      responses:
        "200":
          description: Scored search results (may be from cache).
          content:
            application/json:
              schema:
                type: object
                required: [results, cached]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndustrySearchResult"
                  cached:
                    type: boolean
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SerpAPI key not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/image-blocklist:
    get:
      operationId: listImageBlocklist
      tags: [models]
      summary: List all blocked image source URLs for this session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All blocklist entries for this session, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageBlocklistEntry"
    post:
      operationId: addImageBlocklistEntry
      tags: [models]
      summary: Block an image (by sourceUrl) from future searches in this session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUrl, sourceDomain]
              properties:
                sourceUrl:
                  type: string
                sourceDomain:
                  type: string
                title:
                  type: ["string", "null"]
                reason:
                  type: ["string", "null"]
      responses:
        "200":
          description: Already blocked (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBlocklistEntry"
        "201":
          description: Newly blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBlocklistEntry"

  /sessions/{id}/image-blocklist/{entryId}:
    delete:
      operationId: deleteImageBlocklistEntry
      tags: [models]
      summary: Remove a previously blocked image so it can appear in search results again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Blocklist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/variables/{variableId}:
    patch:
      operationId: updateSessionVariable
      tags: [variables]
      summary: Manually rename, retype, or rewrite the definition of a single variable. Other downstream views (graph, models, live model) read on demand and will reflect the change.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: variableId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [independent, mediator, moderator, dependent]
                definition:
                  type: string
      responses:
        "200":
          description: Updated variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        "400":
          description: No supported fields to update / invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Variable not found in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSessionVariable
      tags: [variables]
      summary: Delete a single variable from the session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: variableId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "404":
          description: Variable not found in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/variable-graph:
    get:
      operationId: getVariableGraph
      tags: [variables]
      summary: Get variable relationship graph data for visualization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableGraph"

  /sessions/{id}/model-assistant:
    post:
      operationId: chatModelAssistant
      tags: [models]
      summary: Conversational assistant that helps the user shape model-generation directives based on their notes, files, and the session's papers/variables.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                      attachments:
                        type: array
                        items:
                          type: object
                          required: [name, kind, data]
                          properties:
                            name:
                              type: string
                            kind:
                              type: string
                              enum: [image, text]
                              description: image = base64 data URL; text = plain text (e.g. extracted from a PDF client-side)
                            data:
                              type: string
      responses:
        "200":
          description: Assistant reply, with optional one-click generation directive
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply:
                    type: string
                  suggestion:
                    type: object
                    properties:
                      userPrompt:
                        type: string
                      focusVariableIds:
                        type: array
                        items:
                          type: integer
                      requiredOperators:
                        type: array
                        items:
                          type: string
                  needsMorePapers:
                    type: object
                    description: Set when the AI judges the existing session materials are insufficient to answer the user's research question.
                    required: [reason]
                    properties:
                      reason:
                        type: string
                      searchQuery:
                        type: string
                      missingConstructs:
                        type: array
                        items:
                          type: string
                  liveModelApplied:
                    type: object
                    description: Set when the assistant emitted a `liveModelOps` block and the server applied (or attempted to apply) one or more direct edits to the session's live model. The frontend should refetch the live model after seeing this.
                    required: [applied, rejected, summary, liveModelVersion]
                    properties:
                      summary:
                        type: string
                      liveModelVersion:
                        type: integer
                      applied:
                        type: array
                        items:
                          type: object
                          required: [type, label]
                          properties:
                            type:
                              type: string
                              enum: [addNode, removeNode, addEdge, removeEdge]
                            label:
                              type: string
                            variableId:
                              type: integer
                            fromVariableId:
                              type: integer
                            toVariableId:
                              type: integer
                            relationship:
                              type: string
                      rejected:
                        type: array
                        items:
                          type: object
                          required: [type, label, reason]
                          properties:
                            type:
                              type: string
                              enum: [addNode, removeNode, addEdge, removeEdge]
                            label:
                              type: string
                            reason:
                              type: string

  /sessions/{id}/model-assistant/messages:
    get:
      operationId: getModelAssistantMessages
      tags: [models]
      summary: Get the persisted conversation history for the model assistant in this session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordered list of past messages (oldest first).
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [id, role, content, createdAt]
                      properties:
                        id:
                          type: integer
                        role:
                          type: string
                          enum: [user, assistant]
                        content:
                          type: string
                        attachments:
                          type: array
                          nullable: true
                          items:
                            type: object
                            required: [name, kind]
                            properties:
                              name:
                                type: string
                              kind:
                                type: string
                                enum: [image, text]
                        createdAt:
                          type: string
                          format: date-time
    delete:
      operationId: clearModelAssistantMessages
      tags: [models]
      summary: Delete all persisted assistant messages for this session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared.

  /sessions/{id}/model-assistant/search-model-images:
    post:
      operationId: searchModelImages
      tags: [models]
      summary: Search the web for research model / conceptual framework figures matching a topic. Returns thumbnails plus original page URLs so the user can quickly find the source paper.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Topic / construct to search for. The server will augment it with academic phrasing unless `raw` is true.
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                page:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1-indexed page number for "换一批 / load more". Defaults to 1.
                raw:
                  type: boolean
                  description: When true, skip server-side query augmentation and use the user's text exactly.
                expand:
                  type: boolean
                  description: When true, also run the publisher-restricted lane (site:researchgate.net OR site:sciencedirect.com …) for deeper coverage. Off by default to reduce SerpAPI call count.
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                type: object
                required: [results, query]
                properties:
                  query:
                    type: string
                    description: All expanded queries joined with " | " for display purposes.
                  rawQuery:
                    type: string
                    description: The original query the user typed, before AI expansion.
                  expandedQueries:
                    type: array
                    items:
                      type: string
                    description: AI-expanded English academic queries that were actually searched.
                  provider:
                    type: string
                    enum: [serpapi, brave]
                    description: Which upstream image search provider was actually used.
                  page:
                    type: integer
                    description: Echoes the page number that was actually served.
                  hasMore:
                    type: boolean
                    description: True if the upstream returned a full result set, suggesting more pages may exist.
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, thumbnailUrl, sourceUrl, sourceDomain]
                      properties:
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                        imageUrl:
                          type: string
                        sourceUrl:
                          type: string
                        sourceDomain:
                          type: string
                        width:
                          type: integer
                        height:
                          type: integer
                        category:
                          type: string
                          enum: [conceptual_model, sem_path, framework]
                          description: AI-assigned category — what KIND of model figure this is. Absent only when the AI gate was skipped (raw mode) or fell back.
                        why:
                          type: string
                          description: Short AI-written reason (≤120 chars) explaining why this figure matches the user's session. Absent for fallbacks.
                        verified:
                          type: boolean
                          description: True when the AI relevance gate explicitly approved this image. False for backfilled fallbacks shown to keep the grid full. Absent in raw mode.
        "503":
          description: Search provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/model-assistant/distill-nudge-queries:
    post:
      operationId: distillNudgeQueries
      tags: [models]
      summary: AI-distill the session's topic + variables into 2-3 short English search queries (with friendly Chinese button labels) for the chat opening nudge that points users at image search.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 0-3 short search angles. Empty array means the session has no topic or AI returned nothing usable.
          content:
            application/json:
              schema:
                type: object
                required: [queries]
                properties:
                  queries:
                    type: array
                    items:
                      type: object
                      required: [label, query]
                      properties:
                        label:
                          type: string
                          description: Short, user-facing button label (zh-CN preferred, ≤14 chars).
                        query:
                          type: string
                          description: 4-8 word English academic search query that gets passed to the image search backend.
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/papers/{paperId}/model-figures:
    get:
      operationId: getPaperModelFigures
      tags: [papers]
      summary: Find model / framework figures for a single paper. Cached on the paper row after the first call.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: paperId
          in: path
          required: true
          schema:
            type: integer
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
          description: When true, ignores cache and re-runs the upstream search.
      responses:
        "200":
          description: Up to 3 figure thumbnails for this paper (may be empty).
          content:
            application/json:
              schema:
                type: object
                required: [paperId, results, cached]
                properties:
                  paperId:
                    type: integer
                  cached:
                    type: boolean
                  fetchedAt:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, thumbnailUrl, sourceUrl, sourceDomain]
                      properties:
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                        imageUrl:
                          type: string
                        sourceUrl:
                          type: string
                        sourceDomain:
                          type: string
        "404":
          description: Paper not found in the specified session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Image search provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/model-assistant/search-model-papers:
    post:
      operationId: searchModelPapers
      tags: [models]
      summary: Search OpenAlex for papers likely to contain a conceptual model figure on the topic. Returns paper cards plus an AI-judged "model figure likelihood" so the user can quickly find papers worth opening to look at the model diagram inside.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Topic / construct to search for. The server will translate Chinese / rough English into precise academic queries unless `raw` is true.
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                page:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1-indexed page number for "换一批 / load more". Defaults to 1.
                raw:
                  type: boolean
                  description: When true, skip AI query expansion.
      responses:
        "200":
          description: Paper search results with model-figure likelihood
          content:
            application/json:
              schema:
                type: object
                required: [papers, query]
                properties:
                  query:
                    type: string
                  rawQuery:
                    type: string
                  expandedQueries:
                    type: array
                    items:
                      type: string
                  page:
                    type: integer
                  hasMore:
                    type: boolean
                  papers:
                    type: array
                    items:
                      type: object
                      required: [externalId, title, authors, url, modelFigureLikelihood]
                      properties:
                        externalId:
                          type: string
                        title:
                          type: string
                        abstract:
                          type: ["string", "null"]
                        authors:
                          type: array
                          items:
                            type: string
                        year:
                          type: ["integer", "null"]
                        venue:
                          type: ["string", "null"]
                        citationCount:
                          type: ["integer", "null"]
                        openAccessUrl:
                          type: ["string", "null"]
                        url:
                          type: string
                        modelFigureLikelihood:
                          type: string
                          enum: [high, medium, low]
                          description: AI-judged likelihood that the paper contains a conceptual / SEM model figure.
                        modelFigureReason:
                          type: string
                          description: Short justification for the likelihood rating.
        "502":
          description: Upstream search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/generate:
    post:
      operationId: generateModels
      tags: [models]
      summary: Generate new research model combinations using AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userPrompt:
                  type: string
                  description: Optional user-supplied direction/constraints/research focus to steer the AI
                numModels:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Number of model proposals to generate (default 1)
                focusVariableIds:
                  type: array
                  items:
                    type: integer
                  description: Variable IDs the user wants the AI to prioritize including
                allowPartial:
                  type: boolean
                  description: |
                    When true, allow generation even if some papers in the session have
                    not had their variables extracted yet. The server will record which
                    papers were skipped on each generated model's `partialPassMeta`.
                    When false (default), the server returns 422 if any paper is missing
                    extracted variables.
                includedPaperIds:
                  type: array
                  items:
                    type: integer
                  description: |
                    When provided, only variables from these paper IDs are used for model
                    generation. Papers not in this list are excluded from the variable pool.
                    Obtain AI recommendations by calling score-papers first.
      responses:
        "200":
          description: Generated model combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"
        "422":
          description: Material insufficient for model generation — pre-flight check blocked the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationReadinessError"

  /sessions/{id}/models/score-papers:
    post:
      operationId: scorePapersForGeneration
      tags: [models]
      summary: AI-score each session paper by relevance to the research topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-paper relevance scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperRelevanceScore"

  /sessions/{id}/models:
    get:
      operationId: listSessionModels
      tags: [models]
      summary: List generated models for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/models/{modelId}/recompute-innovation:
    post:
      operationId: recomputeModelInnovation
      tags: [models]
      summary: Recompute a model's `innovationMeta` against the current landscape
      description: |
        Re-runs Phase 2 scoring against the session's CURRENT
        `landscapeVersion` and persists the result. Used by the "重新计算
        创新分析" button when the persisted score is `stale=true` (i.e. the
        landscape was rebuilt after the model was generated). Auth-gated by
        `loadAuthorizedSession`; additionally rejects if the model does not
        belong to the path's `sessionId` (IDOR defense).
      parameters:
        - name: id
          in: path
          required: true
          description: Session id (must own the model).
          schema:
            type: integer
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model with freshly computed innovationMeta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "404":
          description: Model not found or not in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/{modelId}/generate-contribution:
    post:
      operationId: generateContributionStatement
      tags: [models]
      summary: Generate a 7-field contributionStatement with gpt-5-mini
      description: |
        Reads the model's existing `innovationMeta` (edgeNoveltyTags,
        innovationTypes, subScores) plus the session topic, builds a compact
        prompt (≤ 2 000 tokens), calls gpt-5-mini in JSON mode, persists the
        result in `innovationMeta.contributionStatement`, and returns the
        updated model. Auth-gated by `loadAuthorizedSession`.
      parameters:
        - name: id
          in: path
          required: true
          description: Session id (must own the model).
          schema:
            type: integer
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model with contributionStatement populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "400":
          description: Model has no innovationMeta to base the statement on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model not found or not in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI integration unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/{modelId}/refine-contribution:
    post:
      operationId: refineContributionStatement
      tags: [models]
      summary: Rewrite the contributionStatement with the flagship model (gpt-5.4)
      description: |
        Same inputs as `generate-contribution` but uses the flagship model
        for higher-quality output. Requires an existing `contributionStatement`
        (generated first). Auth-gated by `loadAuthorizedSession`.
      parameters:
        - name: id
          in: path
          required: true
          description: Session id (must own the model).
          schema:
            type: integer
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model with refined contributionStatement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "400":
          description: Model has no innovationMeta or no existing statement to refine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model not found or not in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI integration unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/{modelId}/review:
    get:
      operationId: getModelReview
      tags: [models]
      summary: Rule-based reviewer report (zero AI cost)
      description: |
        Computes a 5-dimension reviewer report from the model's persisted
        `innovationMeta` without any AI call. Dimensions: gap existence,
        novelty score, evidence grounding, coverage adequacy, statement
        completeness. Each dimension has `status: ok | warn | fail` and a
        `message`. Auth-gated by `loadAuthorizedSession`.
      parameters:
        - name: id
          in: path
          required: true
          description: Session id (must own the model).
          schema:
            type: integer
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviewer report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerReport"
        "400":
          description: Model has no innovationMeta yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model not found or not in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/models/{modelId}/ai-review:
    post:
      operationId: generateAiReview
      tags: [models]
      summary: AI deep review via gpt-5-mini (Markdown narrative)
      description: |
        Feeds the rule-based reviewer report + a summary of `innovationMeta`
        to gpt-5-mini and returns a Markdown narrative with reviewer-persona
        commentary (max 1 200 completion tokens). Auth-gated by
        `loadAuthorizedSession`. Cost: gpt-5-mini only.
      parameters:
        - name: id
          in: path
          required: true
          description: Session id (must own the model).
          schema:
            type: integer
        - name: modelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI review result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewResult"
        "400":
          description: Model has no innovationMeta yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model not found or not in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI integration unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/landscape:
    get:
      operationId: getSessionLandscape
      tags: [models]
      summary: Read the per-session literature landscape (Phase 2 Innovation Layer)
      description: |
        Returns the snapshot the Innovation Layer reasons over: coverage,
        every aggregated `constructRelationships` row, the AI-distilled
        theory clusters, and the set of evidenced theory backbones. Pure
        read — does NOT trigger a rebuild. Auth-gated by
        `loadAuthorizedSession`. The Landscape page calls this on mount.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Landscape snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLandscape"
        "400":
          description: Invalid session id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/landscape/gap-report:
    post:
      operationId: generateSessionGapReport
      tags: [models]
      summary: Generate (or return cached) AI gap report for this session's landscape
      description: |
        Calls gpt-5-mini to identify research gaps from the landscape snapshot.
        Result is cached in `sessions.landscapeMeta.gapReport` keyed by
        `landscapeVersion`. Re-calling after a landscape rebuild regenerates
        automatically (old version != new landscapeVersion → cache miss).
        Auth-gated by `loadAuthorizedSession`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gap report (fresh or cached).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapReport"
        "400":
          description: Landscape has not been built yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/learning-stats:
    get:
      operationId: getSessionLearningStats
      tags: [models]
      summary: How many feedback rounds the AI has learned from for this session/global
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalFeedback:
                    type: integer
                  withSelections:
                    type: integer
                  withEdits:
                    type: integer
                required: [totalFeedback, withSelections, withEdits]

  /models/{id}:
    patch:
      operationId: updateModel
      tags: [models]
      summary: Update a model (user edits to name/description/rationale/nodes/edges)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rationale:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
    get:
      operationId: getModel
      tags: [models]
      summary: Get a specific research model
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research model detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/quality-report:
    get:
      operationId: getModelQualityReport
      tags: [models]
      summary: Compute a structural / evidence / layer / role-duplication / moderator-justified quality report for a model. Pure compute — no AI call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quality report
          content:
            application/json:
              schema:
                type: object
                required: [structuralScore, evidenceScore, layerCompliance, duplicateRoleCheck, moderatorJustified, weakEdges, totals]
                properties:
                  structuralScore:
                    type: integer
                    description: 0-100. Heuristic match against any of the 17 theory backbones.
                  evidenceScore:
                    type: integer
                    description: 0-100. Percentage of edges with evidenceHypothesisId or effectSize or evidenceLocation.
                  layerCompliance:
                    type: boolean
                    description: True when no edge crosses construct layers in the wrong direction (cognitive→stimulus is wrong).
                  duplicateRoleCheck:
                    type: boolean
                    description: True when no canonical construct appears in two conflicting roles (mediator AND moderator).
                  moderatorJustified:
                    type: boolean
                    description: True when EVERY moderates-edge has a non-empty moderatorJustification.
                  weakEdges:
                    type: array
                    items:
                      type: object
                      required: [fromVariableName, toVariableName, reason]
                      properties:
                        fromVariableName:
                          type: string
                        toVariableName:
                          type: string
                        reason:
                          type: string
                          description: Short i18n-ready code-style reason, e.g. "no_evidence", "layer_jump", "duplicate_role", "missing_moderator_justification".
                  totals:
                    type: object
                    required: [edges, edgesWithEvidence, moderatesEdges, moderatesJustified]
                    properties:
                      edges:
                        type: integer
                      edgesWithEvidence:
                        type: integer
                      moderatesEdges:
                        type: integer
                      moderatesJustified:
                        type: integer
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/literature-review:
    post:
      operationId: generateModelLiteratureReview
      tags: [models]
      summary: AI-generate a publication-ready literature review paragraph (with APA-7 in-text citations) summarizing the model and its evidence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lang:
                  type: string
                  enum: [zh, en]
                  description: Language for the generated paragraph. Defaults to "zh".
      responses:
        "200":
          description: Generated paragraph
          content:
            application/json:
              schema:
                type: object
                required: [markdown, lang]
                properties:
                  markdown:
                    type: string
                    description: Markdown paragraph with APA-7 in-text citations like (Wang & Liu, 2023).
                  lang:
                    type: string
                    enum: [zh, en]
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /models/{id}/select:
    post:
      operationId: selectModel
      tags: [models]
      summary: Mark a model as selected by the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchModel"

  /sessions/{id}/live-model:
    get:
      operationId: getLiveModel
      tags: [live-model]
      summary: Get the user's evolving research model for this session (lazy-creates on first access)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live model with nodes and edges
          content:
